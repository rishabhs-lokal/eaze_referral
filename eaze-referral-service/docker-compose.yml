services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eaze
    ports:
      # Host port 5532 (not 5432) — avoids clashing with any other local Postgres already
      # bound to the default port. Change freely; nothing else depends on this mapping.
      - "5532:5432"
    volumes:
      - eaze_referral_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eaze"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Runs once and exits — the same pattern as the Job used in k8s/migration-job.yaml. Never
  # runs as part of the `app` service itself: with multiple app replicas, letting each one run
  # migrations on boot would race them against each other.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eaze
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      # Host port 8090 — 8000 was already bound locally to another project's container.
      - "8090:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/eaze
      PUBLIC_BASE_URL: http://localhost:8090
      PLAY_STORE_URL: https://play.google.com/store/apps/details?id=com.eaze.app
      APP_STORE_URL: https://apps.apple.com/app/idXXXXXXXXX
      FALLBACK_URL: https://play.google.com/store/apps/details?id=com.eaze.app
      LOG_LEVEL: info
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eaze_referral_pgdata:

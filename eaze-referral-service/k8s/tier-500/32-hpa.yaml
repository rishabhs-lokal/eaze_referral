# Optional. Requires the metrics-server add-on. Demonstrates that the multi-pod design actually
# scales horizontally — remove this file if you'd rather manage replica count manually.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eaze-referral-api
  namespace: eaze-referral-500
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eaze-referral-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

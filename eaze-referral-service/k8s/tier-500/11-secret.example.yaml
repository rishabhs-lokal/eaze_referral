# TEMPLATE — do not commit a copy of this with real values filled in.
#
# Copy to 11-secret.yaml (already gitignored), fill in the real DATABASE_URL, and apply it — or,
# for a real cluster, generate this Secret from your actual secret manager (Sealed Secrets,
# External Secrets Operator, Vault, cloud provider's CSI secret store, etc.) instead of applying
# a plain manifest at all.
apiVersion: v1
kind: Secret
metadata:
  name: eaze-referral-secrets
  namespace: eaze-referral-500
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/DBNAME"
  # Redash API key — a USER key, not a query key: query keys are scoped to one query and there
  # is only one slot here, so two queries with different query keys would mean one of them 403s.
  REDASH_API_KEY: "REPLACE_ME"
  # Eaze coin-credit auth key. This one moves real coins — treat accordingly.
  EAZE_FREE_COINS_AUTH_KEY: "REPLACE_ME"
  # Shared secret matching the Apps Script's WEBHOOK_SECRET property. Omit if the Sheet mirror
  # is not in use.
  GOOGLE_SHEETS_WEBHOOK_SECRET: "REPLACE_ME"

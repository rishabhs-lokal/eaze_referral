# Non-secret configuration. DATABASE_URL lives in a Secret (11-secret.example.yaml), never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eaze-referral-config
  namespace: eaze-referral-500
data:
  # The only two keys that differ from k8s/tier-1000/10-configmap.yaml — everything else in this
  # namespace runs the identical image as the 1000-coin tier.
  SIGNUP_BONUS_COINS: "500"
  RECHARGE_BONUS_COINS: "500"
  # Must match the ingress host in the Devtron deployment template, and the web
  # build's EXPO_PUBLIC_API_BASE_URL. One value, three places — a mismatch leaves the
  # page loading fine while every API call fails.
  PUBLIC_BASE_URL: "https://eaze-referral500.eazeapp.com"
  # Verified by resolving the OneLink (eaze.onelink.me/x8qY/eirps9xf) with per-platform
  # user agents: iOS lands on id6748073409, Android on live.emotionalcare.eazeapp. The
  # previous values here were a placeholder (idXXXXXXXXX) and the wrong package name
  # (com.eaze.app), so anything still hitting /r/{code} was sent to two dead listings.
  # These only serve that legacy redirect — the invite message itself now carries the
  # OneLink, which does this routing for us.
  PLAY_STORE_URL: "https://play.google.com/store/apps/details?id=live.emotionalcare.eazeapp"
  APP_STORE_URL: "https://apps.apple.com/in/app/eaze-app-talk-feel-better/id6748073409"
  FALLBACK_URL: "https://eaze.onelink.me/x8qY/eirps9xf"
  LOG_LEVEL: "info"
  DATABASE_SSL_MODE: "require"
  DB_TIMEZONE: "Asia/Kolkata"
  # Per-pod pool sizing — total connections against the database is roughly
  # replicas * (DB_POOL_SIZE + DB_POOL_MAX_OVERFLOW). Tune alongside the Deployment's replica
  # count and the database's max_connections.
  DB_POOL_SIZE: "5"
  DB_POOL_MAX_OVERFLOW: "5"
  # --- Verification and payout. The non-secret half; keys live in the Secret. ---
  # Redash is where this service confirms against Eaze's real data that a referred person
  # registered and actually paid. Both query ids are required: 20610 answers "is this number
  # already an Eaze account" at save time, the payments query answers "have they paid".
  REDASH_BASE_URL: "https://analytics.getlokalapp.com"
  REDASH_VERIFY_PHONE_QUERY_ID: "20610"
  REDASH_PAYMENTS_QUERY_ID: "20649"
  # How long POST /intents waits for the save-time "already an Eaze user" check before saving
  # anyway. Exceeding it is not an error — the background check still runs.
  PHONE_CHECK_TIMEOUT_SECONDS: "8"
  # How often the service re-checks who has paid and credits them. This is what makes payouts
  # happen on their own; 0 disables the loop entirely.
  # 0 = the payout loop is OFF. Nobody is credited until someone calls
  # POST /admin/reconcile. This is the shipping default on purpose: the two ways to get
  # it wrong are not symmetric. Forget to set 0 and the first real credit this programme
  # ever makes happens unattended, against a payout path never exercised on production
  # data, and a wrong credit cannot be clawed back out of a user's wallet. Forget to set
  # 900 and payouts simply do not happen — visible in verification-summary, and fixed by
  # editing one value.
  #
  # Set to 900 (a pass every 15 minutes, fully automatic) once the supervised first run
  # has credited someone and you have checked a real wallet. DEPLOY_DEVTRON.md step 5.
  RECONCILE_INTERVAL_SECONDS: "0"
  # Stop polling a referral that never produced an Eaze account after this many days.
  # Nothing else retires a row, so without this the queue only grows and dead invites
  # crowd out live ones against the fixed per-pass budget. Someone who signed up but has
  # not recharged is never expired. 0 disables it. T&C §6 covers expiring a pending referral.
  REFERRAL_EXPIRY_DAYS: "90"
  # Eaze's coin-credit endpoint. The auth key is in the Secret.
  EAZE_FREE_COINS_API_URL: "https://api.eazeapp.com/payments/free-coins/upload/"
  EAZE_FREE_COINS_AUTH_HEADER: "x-n8n-auth-key"
  # Optional human-readable mirror of the pipeline into a Google Sheet. URL is not a secret;
  # the shared secret that authenticates to it is.
  GOOGLE_SHEETS_WEBHOOK_URL: "https://script.google.com/macros/s/AKfycbxkIAl7MfVNluogf8WN--degrVtMxmw-I5I4EPcKAN6hsTiYSlHWkYltTj_CjOhYwSA5A/exec"

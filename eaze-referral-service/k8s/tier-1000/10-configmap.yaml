# Non-secret configuration. DATABASE_URL lives in a Secret (11-secret.example.yaml), never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eaze-referral-config
  namespace: eaze-referral-1000
data:
  # The only two keys that differ from k8s/tier-500/10-configmap.yaml — everything else in this
  # namespace runs the identical image as the 500-coin tier.
  SIGNUP_BONUS_COINS: "1000"
  RECHARGE_BONUS_COINS: "1000"
  PUBLIC_BASE_URL: "https://refer.eaze.app"
  PLAY_STORE_URL: "https://play.google.com/store/apps/details?id=com.eaze.app"
  APP_STORE_URL: "https://apps.apple.com/app/idXXXXXXXXX"
  FALLBACK_URL: "https://play.google.com/store/apps/details?id=com.eaze.app"
  LOG_LEVEL: "info"
  DATABASE_SSL_MODE: "require"
  DB_TIMEZONE: "Asia/Kolkata"
  # Per-pod pool sizing — total connections against the database is roughly
  # replicas * (DB_POOL_SIZE + DB_POOL_MAX_OVERFLOW). Tune alongside the Deployment's replica
  # count and the database's max_connections.
  DB_POOL_SIZE: "5"
  DB_POOL_MAX_OVERFLOW: "5"
  # --- Verification and payout. The non-secret half; keys live in the Secret. ---
  # Redash is where this service confirms against Eaze's real data that a referred person
  # registered and actually paid. Both query ids are required: 20610 answers "is this number
  # already an Eaze account" at save time, the payments query answers "have they paid".
  REDASH_BASE_URL: "https://analytics.getlokalapp.com"
  REDASH_VERIFY_PHONE_QUERY_ID: "20610"
  REDASH_PAYMENTS_QUERY_ID: "20649"
  # How long POST /intents waits for the save-time "already an Eaze user" check before saving
  # anyway. Exceeding it is not an error — the background check still runs.
  PHONE_CHECK_TIMEOUT_SECONDS: "8"
  # How often the service re-checks who has paid and credits them. This is what makes payouts
  # happen on their own; 0 disables the loop entirely.
  RECONCILE_INTERVAL_SECONDS: "900"
  # Eaze's coin-credit endpoint. The auth key is in the Secret.
  EAZE_FREE_COINS_API_URL: "https://api.eazeapp.com/payments/free-coins/upload/"
  EAZE_FREE_COINS_AUTH_HEADER: "x-n8n-auth-key"
  # Optional human-readable mirror of the pipeline into a Google Sheet. URL is not a secret;
  # the shared secret that authenticates to it is.
  GOOGLE_SHEETS_WEBHOOK_URL: ""

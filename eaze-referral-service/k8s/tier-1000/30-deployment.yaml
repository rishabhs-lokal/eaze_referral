apiVersion: apps/v1
kind: Deployment
metadata:
  name: eaze-referral-api
  namespace: eaze-referral-1000
  labels:
    app: eaze-referral-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below `replicas` ready pods during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      app: eaze-referral-api
  template:
    metadata:
      labels:
        app: eaze-referral-api
    spec:
      # Give in-flight requests time to finish before the pod is killed. Uvicorn handles SIGTERM
      # by stopping new connections and draining existing ones; this just gives it room to do so.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ${IMAGE}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: eaze-referral-config
            - secretRef:
                name: eaze-referral-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
